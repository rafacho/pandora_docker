# ROS2 port note (2026-08-04): bridges the Gazebo Sim topics published by the
# sensors/plugins declared in pandora_gazebo/urdf/plugins/*.gazebo and
# pandora_gazebo/urdf/pandora.gazebo to ROS2, replacing the ROS1 Gazebo
# Classic plugins (libgazebo_ros_bumper.so, libgazebo_ros_imu_sensor.so) that
# used to publish these directly as ROS topics themselves.
#
# Fix (2026-08-25): ros_topic_name below is relative (no leading "/") for
# every entry except /clock. This parameter_bridge Node runs inside
# bringup.launch.py's PushRosNamespace(namespace) group, so a relative name
# resolves under that namespace (e.g. "contacts_1" -> "/pandora/contacts_1")
# the same way any other ROS2 node's relative topic would -- an absolute
# name (leading "/") would instead bypass the namespace entirely, which is
# exactly why /clock (the simulation-wide clock every use_sim_time node
# needs, in or out of this namespace) is kept absolute on purpose.
#
# Older fix note (2026-08-25): the contact sensors' gz_topic_name below contains the
# literal placeholder __WORLD__, NOT the actual world name -- this file is a
# template. bringup.launch.py's launch_setup() substitutes __WORLD__ with
# whichever world was picked (the 'world' launch arg -> flat/sinusoidal) and
# writes the result to ros_gz_bridge.generated.yaml, which is what actually
# gets passed to parameter_bridge. Editing this file directly is fine; just
# don't remove the placeholder. Background: unlike the Imu system (which goes
# through gz-sensors' generic Sensor::Topic() and honors an explicit <topic>
# override), gz-sim's Contact system ignores the contact sensor's <topic>
# element entirely and always publishes on the auto-generated, world-scoped
# topic /world/<world>/model/pandora/link/wheel_N/sensor/wheel_N_contact_sensor/contact
# (confirmed empirically via `gz topic -i`) -- so the bridge has to target
# that exact path instead of the /pandora/contacts_N the SDF declares.
- ros_topic_name: "contacts_1"
  gz_topic_name: "/world/__WORLD__/model/pandora/link/wheel_1/sensor/wheel_1_contact_sensor/contact"
  ros_type_name: "ros_gz_interfaces/msg/Contacts"
  gz_type_name: "gz.msgs.Contacts"
  direction: GZ_TO_ROS

- ros_topic_name: "contacts_2"
  gz_topic_name: "/world/__WORLD__/model/pandora/link/wheel_2/sensor/wheel_2_contact_sensor/contact"
  ros_type_name: "ros_gz_interfaces/msg/Contacts"
  gz_type_name: "gz.msgs.Contacts"
  direction: GZ_TO_ROS

- ros_topic_name: "contacts_3"
  gz_topic_name: "/world/__WORLD__/model/pandora/link/wheel_3/sensor/wheel_3_contact_sensor/contact"
  ros_type_name: "ros_gz_interfaces/msg/Contacts"
  gz_type_name: "gz.msgs.Contacts"
  direction: GZ_TO_ROS

- ros_topic_name: "contacts_4"
  gz_topic_name: "/world/__WORLD__/model/pandora/link/wheel_4/sensor/wheel_4_contact_sensor/contact"
  ros_type_name: "ros_gz_interfaces/msg/Contacts"
  gz_type_name: "gz.msgs.Contacts"
  direction: GZ_TO_ROS

- ros_topic_name: "imu"
  gz_topic_name: "/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

# Root-link ("dummy") world pose, published by the gz-sim-pose-publisher-system
# plugin in pandora.gazebo; consumed by pandora_control's world_broadcaster
# node to re-publish it as the "odom"->"dummy" TF.

- ros_topic_name: "pose"
  gz_topic_name: "/pandora/pose"
  ros_type_name: "geometry_msgs/msg/Pose"
  gz_type_name: "gz.msgs.Pose"
  direction: GZ_TO_ROS

- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS
